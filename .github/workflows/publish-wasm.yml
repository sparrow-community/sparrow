# Publish @sparrow-community/wasm to npm via Trusted Publishing (OIDC).
#
# Primary trigger: push of an annotated or lightweight tag
#   wasm-vYYYY.M.D-alpha.N
# Example: wasm-v2026.10.5-alpha.1 → npm version 2026.10.5-alpha.1
#
# Emergency fallback: workflow_dispatch (bump+publish, or retag_only).
# Path pushes to main/wasm/** do NOT publish (use a release tag).
#
# Dist-tags (every successful publish moves both):
#   - latest — set by `npm publish --tag latest`
#   - alpha  — same version via `npm dist-tag add` (OIDC)
# Requires Trusted Publisher → Allowed actions: npm publish + Allow npm dist-tag.
#
# Trusted Publisher fields (npmjs.com → package → Trusted Publisher):
#   Organization or user: sparrow-community
#   Repository:           sparrow
#   Workflow filename:    publish-wasm.yml
#   Environment name:     (leave blank)
#   Allowed actions:      npm publish + Allow npm dist-tag
name: publish-wasm

on:
  push:
    tags:
      - "wasm-v*-*-alpha.*"
  workflow_dispatch:
    inputs:
      retag_only:
        description: "Existing version to retag (alpha + latest). Empty = emergency full publish (bump). Prefer cutting a wasm-v* tag instead."
        required: false
        type: string
        default: ""

concurrency:
  group: publish-wasm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm
    env:
      RETAG_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.retag_only || '' }}
      TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: ${{ env.RETAG_ONLY == '' }}
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            bpmn/go.sum
            processing/go.sum
            protocol/go.sum
            wasm/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports OIDC publish + dist-tag (11.21+)
        run: |
          # Dist-tag via Trusted Publishing needs npm ≥ 11.21 (npm docs).
          npm install -g "npm@^11.21.0"
          NPM_VER="$(npm --version)"
          echo "npm version: $NPM_VER"
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 21)) {
              console.error("npm " + process.argv[1] + " lacks OIDC dist-tag (need 11.21+)");
              process.exit(1);
            }
          ' "$NPM_VER"

      - name: Set version from release tag
        if: ${{ env.RETAG_ONLY == '' && env.TAG_NAME != '' }}
        run: |
          set -euo pipefail
          TAG="$TAG_NAME"
          case "$TAG" in
            wasm-v*) VERSION="${TAG#wasm-v}" ;;
            *)
              echo "::error::Unexpected tag '$TAG' (want wasm-vYYYY.M.D-alpha.N)"
              exit 1
              ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "::error::Tag version '$VERSION' must match YYYY.M.D-alpha.N (no leading zeros in M/D)"
            exit 1
          fi
          # Reject leading zeros in month/day (semver-invalid / policy).
          node -e '
            const v = process.argv[1];
            const m = v.match(/^(\d+)\.(\d+)\.(\d+)-alpha\.(\d+)$/);
            if (!m) process.exit(1);
            const [, y, mo, d, n] = m;
            if (String(Number(mo)) !== mo || String(Number(d)) !== d) {
              console.error("leading zeros not allowed in month/day:", v);
              process.exit(1);
            }
            if (Number(n) < 1) {
              console.error("alpha.N must be >= 1:", v);
              process.exit(1);
            }
          ' "$VERSION"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"
          echo "tag $TAG → package.json version $VERSION"

      - name: Bump alpha version (emergency workflow_dispatch only)
        if: ${{ env.RETAG_ONLY == '' && env.TAG_NAME == '' }}
        run: ./scripts/bump-alpha-version.sh

      - name: Build WASM artifacts
        if: ${{ env.RETAG_ONLY == '' }}
        run: ./build.sh

      - name: Publish to npm (OIDC, tag latest)
        if: ${{ env.RETAG_ONLY == '' }}
        # Do not set NODE_AUTH_TOKEN / NPM_TOKEN — that disables OIDC.
        # Explicit --tag latest so prerelease calver still moves the latest dist-tag.
        run: npm publish --access public --tag latest

      - name: Resolve version for dist-tags
        id: ver
        run: |
          if [ -n "$RETAG_ONLY" ]; then
            VERSION="$RETAG_ONLY"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Promote alpha (+ latest on retag-only) to the same version
        # Full publish already set `latest`. This step sets `alpha` to match.
        # Retag-only sets both (no publish). Needs Trusted Publisher
        # "Allow npm dist-tag". Soft-fail on full publish so a lagging alpha
        # does not hide a successful publish; retag-only fails hard.
        working-directory: .
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG="@sparrow-community/wasm"
          VERSION="${VERSION:?}"

          promote() {
            local tag="$1"
            # Prefer native CLI (OIDC when Allow npm dist-tag is on).
            if npm dist-tag add "$PKG@$VERSION" "$tag"; then
              return 0
            fi
            echo "native npm dist-tag failed for $tag; trying OIDC helper…"
            node .github/scripts/oidc-dist-tag.mjs "$PKG" "$VERSION" "$tag"
          }

          set +e
          if [ -n "$RETAG_ONLY" ]; then
            promote latest
            latest_rc=$?
          else
            latest_rc=0
          fi
          promote alpha
          alpha_rc=$?
          set -e

          if [ "$latest_rc" -ne 0 ] || [ "$alpha_rc" -ne 0 ]; then
            echo "::warning::dist-tag incomplete (latest_rc=$latest_rc alpha_rc=$alpha_rc)."
            echo "Enable Trusted Publisher → Allow npm dist-tag for publish-wasm.yml, then re-run"
            echo "retag_only=$VERSION or owner CLI:"
            echo "  npm dist-tag add $PKG@$VERSION alpha"
            if [ -n "$RETAG_ONLY" ]; then
              echo "  npm dist-tag add $PKG@$VERSION latest"
              exit 1
            fi
            exit 0
          fi
          echo "dist-tags ok: alpha (+ latest if retag) → $PKG@$VERSION"
